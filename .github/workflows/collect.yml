# 위협정보 수집: 1시간마다 자동 실행 (수동 실행도 가능: Actions → 위협정보 수집 → Run workflow)
# 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#   DATABASE_URL  Supabase Session pooler 주소
#   APP_ENC_KEY   Vercel 에 넣은 APP_ENC_KEY 와 "같은 값" (출처의 API 키를 복호화하는 데 사용)
name: 위협정보 수집

on:
  schedule:
    - cron: "17 * * * *" # 매시 17분 (UTC 기준 = 한국 시간으로도 매시 17분)
  workflow_dispatch:

# 앞선 실행이 아직 끝나지 않았으면 겹치지 않게 기다린다
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 수집 실행
        run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENC_KEY: ${{ secrets.APP_ENC_KEY }}
