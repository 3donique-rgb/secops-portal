# IP·국가 확인: 1시간마다 도메인의 IP(DNS)와 IP 대역의 국가(RDAP, whois 후속 표준)를 채운다.
# 도메인 IP는 DNS 로 찾고(한 번에 최대 5,000개, 12분 제한), 국가는 5개 RIR 의 공개 국가 목록으로 채운다.
# 필요한 Secrets: DATABASE_URL
name: IP·국가 확인

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 확인 실행
        run: npm run enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
