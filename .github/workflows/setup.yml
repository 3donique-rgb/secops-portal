# 초기 설정: 최초 관리자 계정 만들기, 개발용 가짜 데이터 넣기/지우기
# 사용법: GitHub 저장소 → Actions → "초기 설정" → Run workflow → 작업 선택
# 필요한 값은 GitHub 저장소의 Secrets에 넣어 둔다 (이 파일에는 값이 없다):
#   DATABASE_URL (Supabase Session pooler 주소), INITIAL_ADMIN_USERNAME, INITIAL_ADMIN_PASSWORD
name: 초기 설정

on:
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        type: choice
        required: true
        options:
          - db-update   # DB 표를 최신으로 맞추기 (새 기능을 올린 뒤 한 번)
          - admin       # 최초 관리자 계정 만들기
          - demo        # 가짜 데이터 넣기
          - demo-clear  # 가짜 데이터만 지우기
          - cron-setup  # 정시 실행 예약을 Supabase에 만들기 (GitHub 예약이 늦거나 빠질 때 대비)
          - cron-status # 정시 실행 예약이 잘 돌고 있는지 확인

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB 표 최신으로 맞추기
        if: inputs.task == 'db-update'
        run: npm run db:update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 최초 관리자 만들기
        if: inputs.task == 'admin'
        run: npm run seed:admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
      - name: 가짜 데이터 넣기
        if: inputs.task == 'demo'
        run: npm run seed:demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 가짜 데이터 지우기
        if: inputs.task == 'demo-clear'
        run: npm run seed:demo -- --clear
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 정시 실행 예약 만들기
        if: inputs.task == 'cron-setup'
        run: npm run cron:setup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 정시 실행 예약 확인
        if: inputs.task == 'cron-status'
        run: npm run cron:status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
