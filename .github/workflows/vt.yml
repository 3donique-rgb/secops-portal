# VirusTotal 자동 평판 조회: 3시간마다 최대 50건 (하루 상한 400건, 무료 키 한도 보호)
# 필요한 Secrets: DATABASE_URL, VT_API_KEY (VirusTotal 무료 API 키 - 직접 입력)
# VT_API_KEY 가 없으면 아무것도 하지 않고 끝난다.
name: VirusTotal 자동 조회

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency:
  group: vt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 자동 조회
        run: npm run vt:auto
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
